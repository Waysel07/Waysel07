<svg xmlns="http://www.w3.org/2000/svg" width="580" height="184" viewBox="0 0 580 184" role="img" aria-label="fisch.ing: A pixel-art fishing game in the browser. Islands, weather, shinies, live lobbies and a casino run by a card shark.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1d33"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="4" result="g"/><feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
    <feMerge><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="c"><rect x="1" y="1" width="578" height="182" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="580" height="184" fill="url(#bg)"/>
  <circle cx="540" cy="20" r="90" fill="#1b6fff" opacity="0.35" filter="url(#blur)"/>
  <circle cx="440" cy="184" r="70" fill="#ff3d7f" opacity="0.35" filter="url(#blur)"/>
</g>
<rect x="1" y="1" width="578" height="182" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#7fdcff" stroke-opacity="0.22"/>
<text x="28" y="50" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-weight="700" font-size="24" fill="#e8f6ff" filter="url(#glow)">🎣 fisch.ing</text>
<text x="552" y="48" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" fill="#5ee7ff">play ↗</text>
<text x="28" y="86" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8fb3c9">A pixel-art fishing game in the browser. Islands, weather,</text><text x="28" y="108" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#8fb3c9">shinies, live lobbies and a casino run by a card shark.</text>
<circle cx="34" cy="157" r="6" fill="#f1e05a"/><text x="46" y="162" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8fb3c9">JavaScript</text>
</svg>