<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Waysel: pixel fishing games, terminal toys and cyberpunk UIs">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1d33"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="g"/>
    <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
    <feMerge><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1200" height="360" rx="18"/></clipPath>
  <style>
    .b { fill: none; stroke: #9fe9ff; stroke-width: 1.5; opacity: .55;
          animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 10% { opacity: .6 }
                       100% { transform: translateY(-400px); opacity: 0 } }
    .swim { animation: swim 16s linear infinite; animation-delay: -9s; }
    @keyframes swim { 0% { transform: translate(-120px, 296px) } 100% { transform: translate(1240px, 288px) } }
    .bob { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .blob { animation: drift 18s ease-in-out infinite alternate; }
    @keyframes drift { 0% { transform: translate(0,0) } 100% { transform: translate(60px,-30px) } }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .b, .swim, .bob, .blob, .cur { animation: none } }
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.35">
    <circle class="blob" cx="220" cy="90" r="150" fill="#1b6fff"/>
    <circle class="blob" style="animation-delay:-6s" cx="960" cy="240" r="170" fill="#ff3d7f"/>
    <circle class="blob" style="animation-delay:-11s" cx="640" cy="300" r="140" fill="#00e0b8"/>
  </g>
  <circle class="b" cx="140" cy="370" r="4" style="animation-duration:7s;animation-delay:-0s"/><circle class="b" cx="230" cy="370" r="3" style="animation-duration:9s;animation-delay:-2s"/><circle class="b" cx="410" cy="370" r="5" style="animation-duration:8s;animation-delay:-4s"/><circle class="b" cx="560" cy="370" r="3" style="animation-duration:10s;animation-delay:-1s"/><circle class="b" cx="700" cy="370" r="4" style="animation-duration:7.5s;animation-delay:-3s"/><circle class="b" cx="880" cy="370" r="6" style="animation-duration:9.5s;animation-delay:-0.5s"/><circle class="b" cx="980" cy="370" r="3" style="animation-duration:8.5s;animation-delay:-5s"/><circle class="b" cx="1080" cy="370" r="4" style="animation-duration:7s;animation-delay:-2.5s"/>
  <g class="swim"><g class="bob"><rect x="35" y="0" width="5" height="5" fill="#d9771f"/><rect x="40" y="0" width="5" height="5" fill="#d9771f"/><rect x="45" y="0" width="5" height="5" fill="#d9771f"/><rect x="50" y="0" width="5" height="5" fill="#d9771f"/><rect x="0" y="5" width="5" height="5" fill="#d9771f"/><rect x="25" y="5" width="5" height="5" fill="#d9771f"/><rect x="30" y="5" width="5" height="5" fill="#ffb547"/><rect x="35" y="5" width="5" height="5" fill="#ffb547"/><rect x="40" y="5" width="5" height="5" fill="#ffb547"/><rect x="45" y="5" width="5" height="5" fill="#ffb547"/><rect x="50" y="5" width="5" height="5" fill="#ffb547"/><rect x="55" y="5" width="5" height="5" fill="#d9771f"/><rect x="60" y="5" width="5" height="5" fill="#d9771f"/><rect x="0" y="10" width="5" height="5" fill="#d9771f"/><rect x="5" y="10" width="5" height="5" fill="#d9771f"/><rect x="20" y="10" width="5" height="5" fill="#d9771f"/><rect x="25" y="10" width="5" height="5" fill="#ffb547"/><rect x="30" y="10" width="5" height="5" fill="#ffb547"/><rect x="35" y="10" width="5" height="5" fill="#ffe08a"/><rect x="40" y="10" width="5" height="5" fill="#ffe08a"/><rect x="45" y="10" width="5" height="5" fill="#ffe08a"/><rect x="50" y="10" width="5" height="5" fill="#ffb547"/><rect x="55" y="10" width="5" height="5" fill="#ffb547"/><rect x="60" y="10" width="5" height="5" fill="#ffb547"/><rect x="65" y="10" width="5" height="5" fill="#d9771f"/><rect x="0" y="15" width="5" height="5" fill="#d9771f"/><rect x="5" y="15" width="5" height="5" fill="#ffb547"/><rect x="10" y="15" width="5" height="5" fill="#d9771f"/><rect x="15" y="15" width="5" height="5" fill="#d9771f"/><rect x="20" y="15" width="5" height="5" fill="#ffb547"/><rect x="25" y="15" width="5" height="5" fill="#ffb547"/><rect x="30" y="15" width="5" height="5" fill="#ffb547"/><rect x="35" y="15" width="5" height="5" fill="#ffe08a"/><rect x="40" y="15" width="5" height="5" fill="#ffe08a"/><rect x="45" y="15" width="5" height="5" fill="#ffe08a"/><rect x="50" y="15" width="5" height="5" fill="#ffb547"/><rect x="55" y="15" width="5" height="5" fill="#ffb547"/><rect x="60" y="15" width="5" height="5" fill="#ffb547"/><rect x="65" y="15" width="5" height="5" fill="#07111f"/><rect x="70" y="15" width="5" height="5" fill="#ffb547"/><rect x="0" y="20" width="5" height="5" fill="#d9771f"/><rect x="5" y="20" width="5" height="5" fill="#ffb547"/><rect x="10" y="20" width="5" height="5" fill="#ffb547"/><rect x="15" y="20" width="5" height="5" fill="#ffb547"/><rect x="20" y="20" width="5" height="5" fill="#ffb547"/><rect x="25" y="20" width="5" height="5" fill="#ffb547"/><rect x="30" y="20" width="5" height="5" fill="#ffb547"/><rect x="35" y="20" width="5" height="5" fill="#ffb547"/><rect x="40" y="20" width="5" height="5" fill="#ffb547"/><rect x="45" y="20" width="5" height="5" fill="#ffb547"/><rect x="50" y="20" width="5" height="5" fill="#ffb547"/><rect x="55" y="20" width="5" height="5" fill="#ffb547"/><rect x="60" y="20" width="5" height="5" fill="#ffb547"/><rect x="65" y="20" width="5" height="5" fill="#ffb547"/><rect x="70" y="20" width="5" height="5" fill="#ffb547"/><rect x="75" y="20" width="5" height="5" fill="#d9771f"/><rect x="0" y="25" width="5" height="5" fill="#d9771f"/><rect x="5" y="25" width="5" height="5" fill="#ffb547"/><rect x="10" y="25" width="5" height="5" fill="#d9771f"/><rect x="15" y="25" width="5" height="5" fill="#d9771f"/><rect x="20" y="25" width="5" height="5" fill="#ffb547"/><rect x="25" y="25" width="5" height="5" fill="#ffb547"/><rect x="30" y="25" width="5" height="5" fill="#ffb547"/><rect x="35" y="25" width="5" height="5" fill="#ffb547"/><rect x="40" y="25" width="5" height="5" fill="#ffb547"/><rect x="45" y="25" width="5" height="5" fill="#ffb547"/><rect x="50" y="25" width="5" height="5" fill="#ffb547"/><rect x="55" y="25" width="5" height="5" fill="#ffb547"/><rect x="60" y="25" width="5" height="5" fill="#ffb547"/><rect x="65" y="25" width="5" height="5" fill="#ffb547"/