  <rect x="60" y="36" width="1080" height="224" rx="16" fill="#ffffff" fill-opacity="0.05"
        stroke="#7fdcff" stroke-opacity="0.22"/>
  <g transform="translate(88,64)">
    <circle r="6" fill="#ff5c8a" opacity=".8"/><circle cx="20" r="6" fill="#ffbd2e" opacity=".8"/><circle cx="40" r="6" fill="#5ee7ff" opacity=".8"/>
    <text x="68" y="5" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" fill="#8fb3c9">~/waysel — fish</text>
  </g>
  <text x="100" y="140" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="20" fill="#8fb3c9"><tspan fill="#5ee7ff">❯</tspan> whoami</text>
  <text x="96" y="204" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-weight="800" font-size="68" letter-spacing="-1" fill="#e8f6ff" filter="url(#glow)">Waysel</text>
  <text x="100" y="238" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="19" fill="#8fb3c9">pixel fishing games · terminal toys · cyberpunk UIs<tspan class="cur" fill="#5ee7ff"> ▍</tspan></text>
